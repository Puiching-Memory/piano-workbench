<main><p>PIANO WORKBENCH / 固定增益对照</p><h1>原创八小节：原生踏板与音符长度近似</h1>

<script>const variants=[{"label": "native-cc64", "src": "native-cc64.mp3"}, {"label": "note-length-approx", "src": "note-length-approx.mp3"}];const player=document.getElementById('player');const title=document.getElementById('selected');const status=document.getElementById('status');let revision=0;document.querySelectorAll('[data-index]').forEach(button=>{button.addEventListener('click',()=>{const v=variants[Number(button.dataset.index)],t=player.currentTime,playing=!player.paused,current=++revision;player.pause();player.src=v.src;title.textContent=v.label;document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));player.addEventListener('loadedmetadata',()=>{if(current!==revision)return;player.currentTime=Math.max(0,Math.min(t,Number.isFinite(player.duration)?player.duration:t));if(playing)player.play().catch(()=>{status.textContent='请点击播放继续试听。';});},{once:true});});});player.addEventListener('error',()=>{status.textContent='无法播放音频：请下载 FLAC，或通过本地 HTTP 服务打开此目录。';});</script></html>

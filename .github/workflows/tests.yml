name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux audio build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: piano-workbench doctor
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg portaudio19-dev
      - run: python -m pip install -e ".[score]"
      - run: python -m unittest discover -s tests -v

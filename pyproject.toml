[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-workbench"
version = "0.1.0"
description = "Reproducible piano transcription, SoundFont auditioning and loudness-matched comparison alongside DuET"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "mido>=1.3,<2", "tinysoundfont==0.3.7"]

[project.optional-dependencies]
transcription = ["duet-score[audio] @ git+https://github.com/wei-zeng98/DuET.git@c98699c021affd3778434c3e7a5cd82214052418"]
score = ["music21>=9,<11", "verovio>=5,<7", "reportlab>=4,<6", "svglib>=1.5,<3"]

[project.scripts]
piano-workbench = "piano_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
